name: Build and deploy SLExam Pro
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate JavaScript
        run: |
          node --check assets/js/app.js
          node --check assets/js/social.js
          node tests/check_init.cjs
          node tests/check_recent.cjs
          node tests/check_images.cjs
          node tests/check_seo.cjs
          node tests/check_pagination.cjs
          node tests/check_paper_details.cjs
      - name: Run build checks
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          python -m pip install Pillow==12.3.0
          python -m unittest discover -s tests -v
      - name: Build static content and social cards
        run: python scripts/build_site.py --output _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
