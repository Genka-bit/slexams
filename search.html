<style>

/* =========================
   SEARCH AREA
   ========================= */

.search-section {

    max-width: 1100px;

    margin: auto;

    padding: 25px 15px;

}


/* =========================
   SEARCH BOX
   ========================= */

.search-box {

    display: flex;

    gap: 10px;

    max-width: 800px;

    margin: 0 auto 25px auto;

}


.search-input {

    flex: 1;

    padding: 15px;

    border: 1px solid #ddd;

    border-radius: 12px;

    font-size: 17px;

    outline: none;

}


.search-input:focus {

    border-color: #1976d2;

}


.search-button {

    padding: 15px 25px;

    border: none;

    border-radius: 12px;

    background: #1976d2;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

}


/* =========================
   FILTERS
   ========================= */

.search-filters {

    display: flex;

    justify-content: center;

    gap: 10px;

    flex-wrap: wrap;

    margin-bottom: 30px;

}


.search-filter {

    padding: 10px 14px;

    border: 1px solid #ddd;

    border-radius: 10px;

    background: white;

}


/* =========================
   RESULT TITLE
   ========================= */

.results-title {

    margin-bottom: 20px;

}


/* =========================
   RESULT CARD
   ========================= */

.search-result-card {

    display: block;

    text-decoration: none;

    color: inherit;

    background: white;

    border-radius: 15px;

    padding: 18px;

    margin-bottom: 15px;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,0.08);

    transition: 0.2s;

}


.search-result-card:hover {

    transform: translateY(-3px);

    box-shadow:
        0 7px 20px
        rgba(0,0,0,0.13);

}


.result-type {

    display: inline-block;

    padding: 5px 10px;

    border-radius: 8px;

    background: #e3f2fd;

    color: #1565c0;

    font-size: 13px;

    font-weight: bold;

    margin-bottom: 8px;

}


.search-result-card h3 {

    margin: 5px 0;

}


.search-result-card p {

    color: #666;

    line-height: 1.6;

    margin: 5px 0;

}


/* =========================
   NO RESULTS
   ========================= */

.no-results {

    text-align: center;

    padding: 40px 20px;

    color: #777;

}


/* =========================
   MOBILE
   ========================= */

@media (max-width:600px) {

    .search-box {

        flex-direction: column;

    }

    .search-button {

        width: 100%;

    }

}

</style>

</head>

<script>

/* =========================
   VARIABLES
   ========================= */

const searchInput =
    document.getElementById(
        "searchInput"
    );

const searchButton =
    document.getElementById(
        "searchButton"
    );

const gradeFilter =
    document.getElementById(
        "gradeFilter"
    );

const typeFilter =
    document.getElementById(
        "typeFilter"
    );

const searchResults =
    document.getElementById(
        "searchResults"
    );


let allResults = [];



/* =========================
   LOAD DATA
   ========================= */

async function loadSearchData() {

    allResults = [];


    /* =========================
       APPS
       ========================= */

    try {

        const response =
            await fetch(
                "assets/data/apps.json?v=" +
                Date.now()
            );

        if (response.ok) {

            const data =
                await response.json();

            const apps =
                data.apps || [];


            apps.forEach(
                function(app) {

                    allResults.push({

                        type: "apps",

                        title: app.name,

                        description:
                            app.demo ||
                            app.description ||
                            "",

                        searchText:
                            (
                                app.name +
                                " " +
                                app.demo +
                                " " +
                                app.description
                            ).toLowerCase(),

                        link:
                            "app-detail.html?id=" +
                            encodeURIComponent(
                                app.id
                            ),

                        grade: ""

                    });

                }
            );

        }

    }

    catch(error) {

        console.log(
            "Apps search data unavailable"
        );

    }



    /* =========================
       NEWS
       ========================= */

    try {

        const response =
            await fetch(
                "assets/data/news.json?v=" +
                Date.now()
            );

        if (response.ok) {

            const data =
                await response.json();

            const news =
                data.news || [];


            news.forEach(
                function(item, index) {

                    allResults.push({

                        type: "news",

                        title:
                            item.title,

                        description:
                            item.description ||
                            item.content ||
                            "",

                        searchText:
                            (
                                item.title +
                                " " +
                                item.description +
                                " " +
                                item.content
                            ).toLowerCase(),

                        link:
                            "news-detail.html?id=" +
                            index,

                        grade: ""

                    });

                }
            );

        }

    }

    catch(error) {

        console.log(
            "News search data unavailable"
        );

    }



    /*
     * Initial search
     */

    performSearch();

}



/* =========================
   SEARCH
   ========================= */

function performSearch() {

    const keyword =
        searchInput.value
            .trim()
            .toLowerCase();


    const selectedGrade =
        gradeFilter.value;


    const selectedType =
        typeFilter.value;


    let results =
        allResults.filter(
            function(item) {


                /* Keyword */

                const keywordMatch =
                    !keyword ||
                    item.searchText.includes(
                        keyword
                    );


                /* Type */

                const typeMatch =
                    selectedType === "all" ||
                    item.type ===
                        selectedType;


                /* Grade */

                const gradeMatch =
                    selectedGrade === "all" ||
                    item.searchText.includes(
                        selectedGrade.toLowerCase()
                    );


                return (
                    keywordMatch &&
                    typeMatch &&
                    gradeMatch
                );

            }
        );


    displayResults(
        results,
        keyword
    );

}



/* =========================
   DISPLAY RESULTS
   ========================= */

function displayResults(
    results,
    keyword
) {


    if (!results.length) {

        searchResults.innerHTML = `

            <div class="no-results">

                <h2>
                    😕 No Results Found
                </h2>

                <p>
                    ${
                        keyword
                        ? "“" +
                          keyword +
                          "” தொடர்பான resources கிடைக்கவில்லை."
                        : "Search something above."
                    }
                </p>

            </div>

        `;

        return;

    }



    searchResults.innerHTML = `

        <h2 class="results-title">

            Search Results
            (${results.length})

        </h2>

    `;


    results.forEach(
        function(item) {


            const card =
                document.createElement("a");


            card.className =
                "search-result-card";


            card.href =
                item.link;


            let typeName = "";


            if (
                item.type ===
                "papers"
            ) {

                typeName =
                    "📝 Exam Paper";

            }

            else if (
                item.type ===
                "schemes"
            ) {

                typeName =
                    "📋 Scheme";

            }

            else if (
                item.type ===
                "news"
            ) {

                typeName =
                    "📰 News";

            }

            else if (
                item.type ===
                "apps"
            ) {

                typeName =
                    "📱 App";

            }


            card.innerHTML = `

                <span
                    class="result-type">

                    ${typeName}

                </span>


                <h3>

                    ${item.title}

                </h3>


                <p>

                    ${item.description}

                </p>

            `;


            searchResults.appendChild(
                card
            );

        }
    );

}



/* =========================
   EVENTS
   ========================= */

searchButton.addEventListener(
    "click",
    performSearch
);


searchInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            performSearch();

        }

    }
);


gradeFilter.addEventListener(
    "change",
    performSearch
);


typeFilter.addEventListener(
    "change",
    performSearch
);



/* =========================
   START
   ========================= */

loadSearchData();

</script>
