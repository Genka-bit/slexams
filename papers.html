<!DOCTYPE html>
<html lang="ta">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SLExam - Papers</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f8ff;
}

header{
background:#1565c0;
color:white;
text-align:center;
padding:25px;
}

.logo{
font-size:35px;
font-weight:bold;
}

.container{
width:90%;
max-width:900px;
margin:auto;
padding:30px;
}

h2{

}

.info{
text-align:center;
font-size:18px;

}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

}

.card{

.card a{
display:block;
background:#1565c0;
color:white;
padding:15px;
border-radius:25px;

}

.back{
color:#1565c0;
text-decoration:none;

}


footer{
background:#1565c0;

</head>


<body>


<header>

<div class="logo">
🔵 SLExam
</div>

<p>Exam Papers</p>

<div class="container">

</a>


<div class="info">

</div>


<div class="grid">

</a>

</div>



</div>


</div>



<footer>

© 2026 SLExam

</footer>

new URLSearchParams(window.location.search);

"Grade "+grade+
"<br>"+
subject+
"<br>"+
term+"ஆம் தவணை";
