// ======================================
// Grade Change
// ======================================

gradeSelect.addEventListener("change", () => {

    const grade =
        parseInt(gradeSelect.value, 10);

    subjectSelect.innerHTML = `
        <option value="">
            Select Subject
        </option>
    `;

    streamSelect.value = "";
    streamSelect.disabled = true;


    if (grade >= 1 && grade <= 11) {

        const subjects =
            subjectLists[grade] || [];

        subjects.forEach(subject => {

            const option =
                document.createElement("option");

            option.value = subject;
            option.textContent = subject;

            subjectSelect.appendChild(option);

        });

        return;
    }


    if (grade === 12 || grade === 13) {

        streamSelect.disabled = false;

    }

});


// ======================================
// Stream Change
// ======================================

streamSelect.addEventListener("change", () => {

    const grade =
        parseInt(gradeSelect.value, 10);

    const stream =
        streamSelect.value;

    subjectSelect.innerHTML = `
        <option value="">
            Select Subject
        </option>
    `;


    if (grade !== 12 && grade !== 13) {

        return;

    }


    const subjects =
        streamSubjects[stream] || [];


    subjects.forEach(subject => {

        const option =
            document.createElement("option");

        option.value = subject;
        option.textContent = subject;

        subjectSelect.appendChild(option);

    });

});

let papers = [];


// ======================================
// Add Paper Button
// ======================================

const addPaperBtn =
    document.createElement("button");

addPaperBtn.type =

addPaperBtn.textContent =

addPaperBtn.style.marginTop =
    "10px";

pdfFile.parentNode.appendChild(
    addPaperBtn
);


// ======================================
// Paper List
// ======================================

    document.createElement("div");

paperList.style.marginTop =
    "20px";

resultCard.parentNode.insertBefore(
    paperList,
    resultCard
);


// ======================================
// Add Paper
// ======================================

addPaperBtn.addEventListener("click", () => {

    const grade =
        gradeSelect.value;

    const stream =
        streamSelect.value;

    const subject =
        subjectSelect.value;

    const term =
        termSelect.value;


    if (!grade) {

        alert("Please select Grade.");

        return;

    }


    if (
        (grade === "12" || grade === "13")
        && !stream
    ) {

        alert("Please select Stream.");

        return;

    }


    if (!subject) {

        alert("Please select Subject.");

        return;

    }


    if (!term) {

        alert("Please select Term.");

        return;

    }


    if (!pdfFile.files.length) {

        alert("Please select a PDF file.");

        return;

    }


    const file =
        pdfFile.files[0];


    if (
        !file.name
            .toLowerCase()
            .endsWith(".pdf")
    ) {

        alert("Please select a PDF file.");

        return;

    }


    const pdfName =
        file.name;


    const title =
        pdfName
            .replace(/\.pdf$/i, "")
            .trim();


    let folder =
        `assets/pdf/grade${grade}/`;


    if (stream) {

        folder +=
            `${stream}/`;

    }


    folder +=
        `${subject}/term${term}/`;


    const pdfPath =
        folder + pdfName;


    // Keep the actual File object
    const paper = {

        grade: grade,

        stream: stream,

        subject: subject,

        term: term,

        title: title,

        pdf: pdfPath,

        file: file

    };


    papers.push(paper);


    pdfFile.value = "";


    renderPaperList();


    status.textContent =
        "Paper added successfully.";

});


// ======================================
// Render Paper List
// ======================================

function renderPaperList() {

    paperList.innerHTML = "";

    if (papers.length === 0) {

        return;

    }


    const heading =
        document.createElement("h3");

    heading.textContent =
        `Added Papers (${papers.length})`;

    paperList.appendChild(
        heading
    );


    papers.forEach((paper, index) => {

        const item =
            document.createElement("div");

        item.style.padding =
            "10px";

        item.style.marginBottom =
            "8px";

        item.style.border =
            "1px solid #ddd";

        item.style.borderRadius =
            "8px";


        item.innerHTML = `
            <strong>
                ${index + 1}. ${paper.title}
            </strong>
            <br>
            <small>
                Grade ${paper.grade}
                ${paper.stream
                    ? " - " + paper.stream
                    : ""}
                - ${paper.subject}
                - Term ${paper.term}
            </small>
        `;


        const removeBtn =
            document.createElement("button");

        removeBtn.type =
            "button";

        removeBtn.textContent =
            "Remove";

        removeBtn.style.marginTop =
            "5px";


        removeBtn.addEventListener(
            "click",
            () => {

                papers.splice(index, 1);

                renderPaperList();

            }
        );


        item.appendChild(
            removeBtn
        );


        paperList.appendChild(
            item
        );

    });

}


// ======================================
// Generate JSON
// ======================================

generateBtn.addEventListener(
    "click",
    () => {

        if (papers.length === 0) {

            alert(
                "Please add at least one paper."
            );

            return;

        }


        // Remove File object before JSON
        const jsonPapers =
            papers.map(paper => ({

                title: paper.title,

                pdf: paper.pdf

            }));


        const json =
            JSON.stringify(
                jsonPapers,
                null,
                2
            );


        jsonOutput.value =
            json;


        resultCard.style.display =
            "block";


        status.textContent =
            "JSON generated successfully.";

    }
);


// ======================================
// Copy JSON
// ======================================

copyBtn.addEventListener(
    "click",
    async () => {

        try {

            await navigator.clipboard.writeText(
                jsonOutput.value
            );

            status.textContent =
                "JSON copied successfully!";

        } catch (error) {

            jsonOutput.select();

            document.execCommand("copy");

            status.textContent =
                "JSON copied.";

        }

    }
);


// ======================================
// Upload Papers to GitHub
// ======================================

uploadBtn.addEventListener(
    "click",
    async () => {

        if (papers.length === 0) {

            alert(
                "Please add at least one paper."
            );

            return;

        }


        const adminKey =
            adminKeyInput.value.trim();


        if (!adminKey) {

            alert(
                "Please enter Admin Key."
            );

            return;

        }


        uploadBtn.disabled =
            true;

        addPaperBtn.disabled =
            true;


        try {

            for (
                let i = 0;
                i < papers.length;
                i++
            ) {

                const paper =
                    papers[i];


                status.textContent =
                    `Uploading ${i + 1} of ${papers.length}: ${paper.title}`;


                const formData =
                    new FormData();


                formData.append(
                    "grade",
                    paper.grade
                );


                formData.append(
                    "stream",
                    paper.stream
                );


                formData.append(
                    "subject",
                    paper.subject
                );


                formData.append(
                    "term",
                    paper.term
                );


                formData.append(
                    "pdf",
                    paper.file,
                    paper.file.name
                );


                const response =
                    await fetch(
                        WORKER_URL,
                        {

                            method: "POST",

                            headers: {

                                "X-Admin-Key":
                                    adminKey

                            },

                            body: formData

                        }
                    );


                const result =
                    await response.json();


                if (!response.ok || !result.success) {

                    throw new Error(
                        result.message ||
                        `Upload failed for ${paper.title}`
                    );

                }

            }


            status.textContent =
                "All papers uploaded successfully!";


            alert(
                "All papers uploaded successfully to GitHub."
            );


            papers = [];

            renderPaperList();

            jsonOutput.value = "";

            resultCard.style.display =
                "none";


        } catch (error) {

            console.error(
                "Upload Error:",
                error
            );


            status.textContent =
                "Upload failed: " +
                error.message;


            alert(
                "Upload failed:\n\n" +
                error.message
            );

        } finally {

            uploadBtn.disabled =
                false;

            addPaperBtn.disabled =
                false;

        }

    }
);

// ======================================

const publishNewsBtn =
    document.getElementById("publishNewsBtn");

const newsTitle =
    document.getElementById("newsTitle");

const newsDescription =
    document.getElementById("newsDescription");

const newsDate =
    document.getElementById("newsDate");

const newsImage =
    document.getElementById("newsImage");

const newsLink =
    document.getElementById("newsLink");

const newsStatus =
    document.getElementById("newsStatus");


publishNewsBtn.addEventListener("click", async () => {

    const title =
        newsTitle.value.trim();

    const description =
        newsDescription.value.trim();

    const date =
        newsDate.value;

    const link =
        newsLink.value.trim();


    if (!title) {
        alert("Please enter News Title.");
        return;
    }

    if (!description) {
        alert("Please enter News Description.");
        return;
    }

    if (!date) {
        alert("Please select News Date.");
        return;
    }


    const adminKey =
        adminKeyInput.value.trim();


    if (!adminKey) {
        alert("Please enter Admin Key.");
        return;
    }


    publishNewsBtn.disabled = true;

    newsStatus.textContent =
        "Publishing News...";


    try {

        const formData =
            new FormData();


        formData.append(
            "type",
            "news"
        );

        formData.append(
            "title",
            title
        );

        formData.append(
            "description",
            description
        );

        formData.append(
            "date",
            date
        );

        formData.append(
            "link",
            link
        );


        if (newsImage.files.length) {

            formData.append(
                "image",
                newsImage.files[0],
                newsImage.files[0].name
            );

        }


        const response =
            await fetch(
                WORKER_URL,
                {
                    method: "POST",

                    headers: {
                        "X-Admin-Key":
                            adminKey
                    },

                    body: formData
                }
            );


        const result =
            await response.json();


        if (!response.ok ||
            !result.success) {

            throw new Error(
                result.message ||
                "News upload failed."
            );

        }


        newsStatus.textContent =
            "News published successfully!";

        alert(
            "News published successfully!"
        );


        newsTitle.value = "";
        newsDescription.value = "";
        newsDate.value = "";
        newsImage.value = "";
        newsLink.value = "";


    }
    catch (error) {

        console.error(
            "News Upload Error:",
            error
        );


        newsStatus.textContent =
            "News upload failed: " +
            error.message;


        alert(
            "News upload failed:\n\n" +
            error.message
        );

    }
    finally {

        publishNewsBtn.disabled =
            false;

    }

});
