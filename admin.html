            </option>

        <!-- Subject -->

    Subject
</label>

<select id="subjectSelect">

</select>

            <option value="2">

            </option>

            <option value="3">

        <!-- PDF Filename -->

        <label>
            PDF File Name
        </label>

        <input

            id="pdfInput"
            placeholder="Example: Vidyananda College Maths Grade 11 3rd Term.pdf">



        <button
            id="generateBtn">

            Generate Paper JSON

        </button>



    </div>



    <!-- Result -->

    <div
        class="admin-card"
        id="resultCard"
        style="display:none;">

        <h2>
            Generated JSON
        </h2>


        <textarea
            id="jsonOutput"
            rows="10"

        <button
            id="copyBtn">

            Copy JSON

// Grade change
gradeSelect.addEventListener("change", () => {

    const selectedGrade =
        parseInt(gradeSelect.value, 10);

    subjectSelect.innerHTML = `
        <option value="">
            Select Subject
        </option>
    `;

    // Grade 1-11
    if (
        selectedGrade >= 1 &&
        selectedGrade <= 11
    ) {

        const subjects =
            subjectLists[selectedGrade] || [];

        subjects.forEach(subject => {

            const option =
                document.createElement("option");

            option.value = subject;
            option.textContent = subject;

            subjectSelect.appendChild(option);

        });

        streamSelect.value = "";
        streamSelect.disabled = true;

    }

    // Grade 12-13
    else if (
        selectedGrade === 12 ||
        selectedGrade === 13
    ) {

        streamSelect.disabled = false;

    }

});



/* ==========================
   Generate JSON
========================== */

generateBtn.addEventListener(
    "click",
    () => {


        const grade =
            gradeSelect.value;

        const stream =
            streamSelect.value;

        const subject =
            subjectInput.value.trim();

        const term =
            termSelect.value;

        const pdfName =
            pdfInput.value.trim();



        if (!grade) {

            alert("Please select Grade.");

            return;

        }


        if (!subject) {

            alert("Please enter Subject.");

            return;

        }


        if (!term) {

            alert("Please select Term.");

            return;

        }


        if (!pdfName) {

            alert("Please enter PDF filename.");

            return;

        }



        /*
         * Remove .pdf temporarily
         * for the paper title
         */

        let title =
            pdfName
                .replace(/\.pdf$/i, "")
                .trim();



        /*
         * Create PDF path
         */

        let folder =
            `assets/pdf/grade${grade}/`;



        if (stream) {

            folder +=
                `${stream}/`;

        }


        folder +=
            `${subject}/term${term}/`;



        const pdfPath =
            folder + pdfName;



        /*
         * Paper Object
         */

        const paper = {

            "title": title,

            "pdf": pdfPath

        };



        /*
         * Format JSON
         */

        const json =
            JSON.stringify(
                paper,
                null,
                2
            );



        jsonOutput.value =
            json;


        resultCard.style.display =
            "block";


        status.textContent =
            "JSON generated successfully.";

    }
);



/* ==========================
   Copy JSON
========================== */

copyBtn.addEventListener(
    "click",
    async () => {

        try {

            await navigator.clipboard.writeText(
                jsonOutput.value
            );

            status.textContent =
                "JSON copied successfully!";

        } catch (error) {

            jsonOutput.select();

            document.execCommand("copy");

            status.textContent =
                "JSON copied.";

        }

    }
);
