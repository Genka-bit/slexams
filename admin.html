===================================================== -->

</option>

===================================================== -->

function getAdminKey() {

return adminKeyInput.value.trim();

}


function requireAdminKey() {

if (!getAdminKey()) {

alert("Please enter Admin Key.");

return false;

}

return true;

}


function addOptions(select, subjects) {

select.innerHTML =
`<option value="">Select Subject</option>`;

subjects.forEach(subject => {

const option =
document.createElement("option");

option.value = subject;

option.textContent = subject;

select.appendChild(option);

});

}



/* =====================================================
   PAPER MANAGER
===================================================== */

const gradeSelect =
document.getElementById("gradeSelect");

const streamSelect =
document.getElementById("streamSelect");

const subjectSelect =
document.getElementById("subjectSelect");

const termSelect =
document.getElementById("termSelect");

const pdfFile =
document.getElementById("pdfFile");

const addPaperBtn =
document.getElementById("addPaperBtn");

const uploadBtn =
document.getElementById("uploadBtn");

const paperList =
document.getElementById("paperList");

const paperStatus =
document.getElementById("paperStatus");


let papers = [];


gradeSelect.addEventListener(
"change",
function() {

const grade =
parseInt(
gradeSelect.value,
10
);

subjectSelect.innerHTML =
`<option value="">Select Subject</option>`;

streamSelect.value = "";

streamSelect.disabled = true;


if (grade >= 1 && grade <= 11) {

addOptions(
subjectSelect,
subjectLists[grade] || []
);

}


if (grade === 12 || grade === 13) {

streamSelect.disabled = false;

}

});


streamSelect.addEventListener(
"change",
function() {

const grade =
parseInt(
gradeSelect.value,
10
);

if (
grade !== 12 &&
grade !== 13
) return;

addOptions(
subjectSelect,
streamSubjects[
streamSelect.value
] || []
);

});



addPaperBtn.addEventListener(
"click",
function() {

const grade =
gradeSelect.value;

const stream =
streamSelect.value;

const subject =
subjectSelect.value;

const term =
termSelect.value;

const file =
pdfFile.files[0];


if (!grade) {

alert("Select Grade.");

return;

}


if (
(grade === "12" ||
grade === "13") &&
!stream
) {

alert("Select Stream.");

return;

}


if (!subject) {

alert("Select Subject.");

return;

}


if (!term) {

alert("Select Term.");

return;

}


if (!file) {

alert("Select PDF.");

return;

}


if (
!file.name
.toLowerCase()
.endsWith(".pdf")
) {

alert("Only PDF files.");

return;

}


papers.push({

grade,
stream,
subject,
term,
title:
file.name.replace(
/\.pdf$/i,
""
),
file

});


pdfFile.value = "";

renderPaperList();

paperStatus.textContent =
"Paper added.";

});


function renderPaperList() {

paperList.innerHTML = "";

papers.forEach(
(paper, index) => {

const div =
document.createElement("div");

div.style.padding = "10px";
div.style.marginBottom = "8px";
div.style.border = "1px solid #ddd";
div.style.borderRadius = "8px";

div.innerHTML = `

<strong>
${index + 1}. ${paper.title}
</strong>

<br>

<small>
Grade ${paper.grade}
${paper.stream
? " - " + paper.stream
: ""}
 - ${paper.subject}
 - Term ${paper.term}
</small>

<br>

<button
type="button"
data-index="${index}">

Remove

</button>

`;

div.querySelector("button")
.addEventListener(
"click",
function() {

papers.splice(
index,
1
);

renderPaperList();

});

paperList.appendChild(div);

});

}



uploadBtn.addEventListener(
"click",
async function() {

if (!papers.length) {

alert("Add at least one paper.");

return;

}

if (!requireAdminKey()) return;

uploadBtn.disabled = true;

try {

for (
let i = 0;
i < papers.length;
i++
) {

const paper =
papers[i];

paperStatus.textContent =
`Uploading ${i + 1} / ${papers.length}...`;

const formData =
new FormData();

formData.append(
"type",
"paper"
);

formData.append(
"grade",
paper.grade
);

formData.append(
"stream",
paper.stream
);

formData.append(
"subject",
paper.subject
);

formData.append(
"term",
paper.term
);

formData.append(
"pdf",
paper.file,
paper.file.name
);


const response =
await fetch(
WORKER_URL,
{

method:
"POST",

headers: {

"X-Admin-Key":
getAdminKey()

},

body:
formData

});


const result =
await response.json();

if (
!response.ok ||
!result.success
) {

throw new Error(
result.message ||
"Paper upload failed."
);

}

}


papers = [];

renderPaperList();

paperStatus.textContent =
"✅ All papers uploaded successfully.";

alert(
"All papers uploaded successfully."
);

}
catch(error) {

paperStatus.textContent =
"❌ " + error.message;

alert(error.message);

}
finally {

uploadBtn.disabled = false;

}

});

"❌ " + error.message;

alert(error.message);

}
finally {

button.disabled = false;

}

});



/* =====================================================
   APP MANAGER
===================================================== */

const downloadMethod =
document.getElementById(
"downloadMethod"
);

const appFileBox =
document.getElementById(
"appFileBox"
);

const externalLinkBox =
document.getElementById(
"externalLinkBox"
);


downloadMethod.addEventListener(
"change",
function() {

if (
downloadMethod.value ===
"external"
) {

appFileBox.style.display =
"none";

externalLinkBox.style.display =
"block";

}
else {

appFileBox.style.display =
"block";

externalLinkBox.style.display =
"none";

}

});


document.getElementById(
"publishAppBtn"
)
.addEventListener(
"click",
async function() {

if (!requireAdminKey()) return;


const platform =
document.getElementById(
"appPlatform"
).value;

const name =
document.getElementById(
"appName"
).value.trim();

const demo =
document.getElementById(
"appDemo"
).value.trim();

const description =
document.getElementById(
"appDescription"
).value.trim();

const version =
document.getElementById(
"appVersion"
).value.trim();

const website =
document.getElementById(
"appWebsite"
).value.trim();

const playStore =
document.getElementById(
"appPlayStore"
).value.trim();

const image =
document.getElementById(
"appImage"
).files[0];

const method =
downloadMethod.value;

const appFile =
document.getElementById(
"appFile"
).files[0];

const externalDownload =
document.getElementById(
"externalDownload"
).value.trim();


if (!platform) {

alert("Select Platform.");

return;

}


if (!name) {

alert("Enter App Name.");

return;

}


if (!image) {

alert("Select App Image.");

return;

}


if (!demo) {

alert("Enter App Demo.");

return;

}


if (!description) {

alert("Enter App Description.");

return;

}


if (!version) {

alert("Enter App Version.");

return;

}


if (
method === "file" &&
!appFile
) {

alert(
"Select APK / EXE file."
);

return;

}


if (
method === "external" &&
!externalDownload
) {

alert(
"Enter External Download Link."
);

return;

}


const formData =
new FormData();

formData.append(
"type",
"app"
);

formData.append(
"platform",
platform
);

formData.append(
"name",
name
);

formData.append(
"demo",
demo
);

formData.append(
"description",
description
);

formData.append(
"version",
version
);

formData.append(
"website",
website
);

formData.append(
"playStore",
playStore
);

formData.append(
"downloadMethod",
method
);

formData.append(
"externalDownload",
externalDownload
);


formData.append(
"image",
image,
image.name
);


if (
method === "file"
) {

formData.append(
"appFile",
appFile,
appFile.name
);

}


const button =
document.getElementById(
"publishAppBtn"
);

const status =
document.getElementById(
"appStatus"
);

button.disabled = true;

status.textContent =
"Publishing App...";


try {

const response =
await fetch(
WORKER_URL,
{

method:
"POST",

headers: {

"X-Admin-Key":
getAdminKey()

},

body:
formData

});


const result =
await response.json();

if (
!response.ok ||
!result.success
) {

throw new Error(
result.message ||
"App publishing failed."
);

}


status.textContent =
"✅ App published successfully.";

alert(
"App published successfully."
);


/* Clear */

document.getElementById(
"appName"
).value = "";

document.getElementById(
"appDemo"
).value = "";

document.getElementById(
"appDescription"
).value = "";

document.getElementById(
"appVersion"
).value = "";

document.getElementById(
"appWebsite"
).value = "";

document.getElementById(
"appPlayStore"
).value = "";

document.getElementById(
"appImage"
).value = "";

document.getElementById(
"appFile"
).value = "";

document.getElementById(
"externalDownload"
).value = "";

}
catch(error) {

status.textContent =
"❌ " + error.message;

alert(error.message);

}
finally {

button.disabled = false;

}

});


</script>

</body>

</html>
