<!DOCTYPE html>
<html lang="ta">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SLExam - Term</title>


<style>

body{

margin:0;
font-family:Arial,sans-serif;
background:#f4f8ff;

}


header{

background:#1565c0;
color:white;
text-align:center;
padding:25px;

}


.logo{

font-size:35px;
font-weight:bold;

}


.container{

width:90%;
max-width:900px;
margin:auto;
padding:30px;

}


h2{

text-align:center;
color:#1565c0;

}


.info{

text-align:center;
font-size:18px;
margin:20px;

}



.grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;

}



.card{

background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
text-align:center;

}


.card a{

display:block;
background:#1565c0;
color:white;
padding:15px;
border-radius:25px;
text-decoration:none;
font-size:18px;

}



.back{

color:#1565c0;
text-decoration:none;
font-weight:bold;

}



footer{

background:#1565c0;
color:white;
text-align:center;
padding:20px;
margin-top:40px;

}


</style>

</head>


<body>


<header>

<div class="logo">
🔵 SLExam
</div>

<p>
Select Term
</p>

</header>



<div class="container">


<a class="back" href="javascript:history.back()">
⬅ Back
</a>



<div class="info">

<h2 id="subjectTitle"></h2>

</div>



<div class="grid">


<div class="card">

<h3>📘 1ஆம் தவணை</h3>

<a id="term1">
Open
</a>

</div>



<div class="card">

<h3>📗 2ஆம் தவணை</h3>

<a id="term2">
Open
</a>

</div>




<div class="card">

<h3>📕 3ஆம் தவணை</h3>

<a id="term3">
Open
</a>

</div>



</div>


</div>



<footer>

© 2026 SLExam

</footer>




<script>


let params =
new URLSearchParams(window.location.search);


let grade =
params.get("grade");


let subject =
params.get("subject");



document.getElementById("subjectTitle").innerHTML =

"Grade " + grade + 
"<br>" +
subject;



document.getElementById("term1").href =

"papers.html?grade="+grade+
"&subject="+subject+
"&term=1";



document.getElementById("term2").href =

"papers.html?grade="+grade+
"&subject="+subject+
"&term=2";



document.getElementById("term3").href =

"papers.html?grade="+grade+
"&subject="+subject+
"&term=3";



</script>


</body>

</html>
