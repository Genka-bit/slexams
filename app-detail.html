<style>

.app-detail-section {

    max-width: 900px;

    margin: auto;

    padding: 25px 15px;

}

.app-detail-card {

    background: white;

    border-radius: 18px;

    padding: 25px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,0.10);

    text-align: center;

}

.app-detail-image {

    width: 140px;

    height: 140px;

    object-fit: cover;

    border-radius: 25px;

    margin-bottom: 15px;

}

.app-detail-name {

    font-size: 28px;

    margin: 10px 0;

}

.app-detail-description {

    font-size: 17px;

    line-height: 1.8;

    color: #555;

    text-align: left;

    margin-top: 20px;

}

.app-info {

    margin-top: 20px;

    padding: 15px;

    background: #f5f7fa;

    border-radius: 12px;

    text-align: left;

}

.app-button {

    display: block;

    width: 100%;

    max-width: 450px;

    margin: 15px auto;

    padding: 14px 20px;

    border-radius: 12px;

    text-decoration: none;

    color: white;

    font-size: 17px;

    font-weight: bold;

    box-sizing: border-box;

}

.play-button {

    background: #16843d;

}

.download-button {

    background: #1976d2;

}

.website-button {

    background: #555;

}

.back-button {

    background: #777;

}


/* =========================
   PREVIEW GALLERY
   ========================= */

.app-preview-section {

    margin-top: 30px;

    text-align: left;

}

.app-preview-section h3 {

    margin-bottom: 15px;

}

.app-preview-gallery {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(160px, 1fr)
        );

    gap: 15px;

}

.app-preview-image {

    width: 100%;

    height: 220px;

    object-fit: cover;

    border-radius: 12px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.12);

    cursor: pointer;

    transition: 0.2s;

}

.app-preview-image:hover {

    transform: scale(1.02);

}

/* =========================
   FULL SCREEN IMAGE VIEWER
   ========================= */

#imageViewer {
    width: 100vw;
    height: 100vh;

    max-width: none;
    max-height: none;

    margin: 0;
    padding: 0;

    border: none;
    background: transparent;

    align-items: center;
    justify-content: center;
}

/* Viewer OPEN ஆனபோது மட்டும் flex ஆக இருக்க வேண்டும் */
#imageViewer[open] {
    display: flex;
}

#imageViewer::backdrop {
    background: rgba(0, 0, 0, 0.92);
}

.image-viewer-image {
    max-width: 90vw;
    max-height: 85vh;

    width: auto;
    height: auto;

    object-fit: contain;

    border-radius: 8px;

    display: block;
}


/* =========================
   CLOSE BUTTON
   ========================= */

.image-viewer-close {

    position: fixed;

    top: 20px;
    right: 20px;

    width: 50px;
    height: 50px;

    border: none;
    border-radius: 50%;

    background: rgba(255,255,255,0.18);

    color: white;

    font-size: 25px;

    cursor: pointer;

    z-index: 10;
}


/* =========================
   PREVIOUS / NEXT
   ========================= */

.image-viewer-prev,
.image-viewer-next {

    position: fixed;

    top: 50%;

    transform: translateY(-50%);

    width: 55px;
    height: 65px;

    border: none;
    border-radius: 12px;

    background: rgba(255,255,255,0.18);

    color: white;

    font-size: 32px;

    cursor: pointer;

    z-index: 10;
}

.image-viewer-prev {
    left: 20px;
}

.image-viewer-next {
    right: 20px;
}


/* =========================
   HOVER
   ========================= */

.image-viewer-close:hover,
.image-viewer-prev:hover,
.image-viewer-next:hover {

    background: rgba(255,255,255,0.32);

}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

    .image-viewer-image {

        max-width: 94vw;
        max-height: 78vh;

        border-radius: 5px;

    }

    .image-viewer-close {

        top: 12px;
        right: 12px;

        width: 45px;
        height: 45px;

        font-size: 22px;

    }

    .image-viewer-prev,
    .image-viewer-next {

        width: 42px;
        height: 55px;

        font-size: 26px;

        background: rgba(255,255,255,0.20);

    }

    .image-viewer-prev {
        left: 8px;
    }

    .image-viewer-next {
        right: 8px;
    }

}

/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

    .app-detail-card {

        padding: 18px;

    }

    .app-detail-image {

        width: 120px;

        height: 120px;

    }

    .app-detail-name {

    }

    .app-preview-gallery {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 10px;

    }

    .app-preview-image {

        height: 180px;

    }

}

<script>
async function loadAppDetail() {

    const container =
        document.getElementById("appDetail");

    if (!container) {
        return;
    }

    const params =
        new URLSearchParams(
            window.location.search
        );

    const appId =
        params.get("id");

    console.log("APP ID:", appId);

    if (!appId) {

        container.innerHTML = `
            <h2>App Not Found</h2>
            <p>No application was selected.</p>

            <a
                class="app-button back-button"
                href="apps.html">

                ← Back to Apps

            </a>
        `;

        return;
    }

    try {

        const response =
            await fetch(
                "assets/data/apps.json?v=" +
                Date.now()
            );

        if (!response.ok) {
            throw new Error(
                "apps.json could not be loaded."
            );
        }

        const data =
            await response.json();

        const apps =
            Array.isArray(data.apps)
            ? data.apps
            : [];

        const app =
            apps.find(
                item => item.id === appId
            );

        if (!app) {

            container.innerHTML = `
                <h2>App Not Found</h2>

                <p>
                    ID: ${appId}
                </p>

                <a
                    class="app-button back-button"
                    href="apps.html">

                    ← Back to Apps

                </a>
            `;

            return;
        }

        /* =========================
           BUTTONS
           ========================= */

        let buttons = "";

        if (app.playStore) {

            buttons += `
                <a
                    class="app-button play-button"
                    href="${app.playStore}"
                    target="_blank"
                    rel="noopener noreferrer">

                    ▶ Google Play

                </a>
            `;
        }

        if (app.download) {

            buttons += `
                <a
                    class="app-button download-button"
                    href="${app.download}"
                    target="_blank"
                    rel="noopener noreferrer">

                    📥 Download App

                </a>
            `;
        }

        if (app.website) {

            buttons += `
                <a
                    class="app-button website-button"
                    href="${app.website}"
                    target="_blank"
                    rel="noopener noreferrer">

                    🌐 Official Website

                </a>
            `;
        }


        /* =========================
           PREVIEW GALLERY
           ========================= */

        let previewGallery = "";

        if (
            Array.isArray(app.previewImages) &&
            app.previewImages.length > 0
        ) {

            previewGallery = `

                <div class="app-preview-section">

                    <h3>
                        📸 App Preview
                    </h3>

                    <div class="app-preview-gallery">

                        ${
                            app.previewImages
                                .map(
                                    image => `

                                    <img
                                        class="app-preview-image"
                                        src="${image}"
                                        alt="${app.name} Preview"
                                        loading="lazy"
                                        data-preview="${image}">

                                    `
                                )
                                .join("")
                        }

                    </div>

                </div>
            `;
        }


        /* =========================
           DISPLAY
           ========================= */

        container.innerHTML = `

            <img
                class="app-detail-image"
                src="${app.mainImage || ""}"
                alt="${app.name}"
                onerror="this.style.display='none'">


            <h1 class="app-detail-name">

                ${app.name}

            </h1>


            <div class="app-info">

                <strong>
                    Platform:
                </strong>

                ${
                    app.platform === "android"
                    ? "🤖 Android"
                    : "🪟 Windows"
                }

                <br><br>

                <strong>
                    Version:
                </strong>

                ${
                    app.version ||
                    "Not specified"
                }

            </div>


            <div class="app-detail-description">

                <h3>
                    📝 About this App
                </h3>

                <p>

                    ${
                        app.description ||
                        app.demo ||
                        "No description available."
                    }

                </p>

            </div>


            ${previewGallery}


            ${buttons}


            <a
                class="app-button back-button"
                href="apps.html">

                ← Back to Apps

            </a>

        `;

        document.title =
            app.name +
            " | SLExam Pro";

    }

    catch (error) {

        console.error(
            "APP DETAIL ERROR:",
            error
        );

        container.innerHTML = `

            <h2>
                Unable to Load App
            </h2>

            <p>
                ${error.message}
            </p>

            <a
                class="app-button back-button"
                href="apps.html">

                ← Back to Apps

            </a>

        `;
    }
}


/* =========================
   DIRECT CALL
   ========================= */

// ======================================
// APP IMAGE CLICK
// ======================================

/* ======================================
   APP IMAGE VIEWER
   ====================================== */

const viewer = document.getElementById("imageViewer");
const viewerImage = document.getElementById("imageViewerImage");
const viewerClose = document.getElementById("imageViewerClose");
const viewerPrev = document.getElementById("imageViewerPrev");
const viewerNext = document.getElementById("imageViewerNext");

let currentPreviewIndex = 0;


/* ======================================
   GET ALL PREVIEW IMAGES
   ====================================== */

function getPreviewImages() {

    return Array.from(
        document.querySelectorAll(".app-preview-image")
    );

}


/* ======================================
   SHOW IMAGE
   ====================================== */

function showPreview(index) {

    const images = getPreviewImages();

    if (images.length === 0) {
        return;
    }

    if (index < 0) {
        index = images.length - 1;
    }

    if (index >= images.length) {
        index = 0;
    }

    currentPreviewIndex = index;

    const image = images[currentPreviewIndex];

    const src =
        image.getAttribute("data-preview");

    if (!src) {
        return;
    }

    viewerImage.src = src;

}


/* ======================================
   OPEN VIEWER
   ====================================== */

document.addEventListener("click", function (event) {

    const image =
        event.target.closest(".app-preview-image");

    if (!image) {
        return;
    }

    const images = getPreviewImages();

    currentPreviewIndex =
        images.indexOf(image);

    showPreview(currentPreviewIndex);

    viewer.showModal();

});


/* ======================================
   CLOSE
   ====================================== */

viewerClose.addEventListener(
    "click",
    function () {

        viewer.close();

        viewerImage.src = "";

    }
);


/* ======================================
   NEXT
   ====================================== */

viewerNext.addEventListener(
    "click",
    function () {

        showPreview(
            currentPreviewIndex + 1
        );

    }
);


/* ======================================
   PREVIOUS
   ====================================== */

viewerPrev.addEventListener(
    "click",
    function () {

        showPreview(
            currentPreviewIndex - 1
        );

    }
);


/* ======================================
   ESC KEY
   ====================================== */

viewer.addEventListener(
    "cancel",
    function () {

        viewerImage.src = "";

    }
);


/* ======================================
   CLOSE WHEN CLICKING BACKDROP
   ====================================== */

viewer.addEventListener(
    "click",
    function (event) {

        if (event.target === viewer) {

            viewer.close();

            viewerImage.src = "";

        }

    }
);


/* ======================================
   MOBILE SWIPE
   ====================================== */

let touchStartX = 0;
let touchStartY = 0;

viewerImage.addEventListener(
    "touchstart",
    function (event) {

        const touch =
            event.touches[0];

        touchStartX = touch.clientX;
        touchStartY = touch.clientY;

    },
    { passive: true }
);


viewerImage.addEventListener(
    "touchend",
    function (event) {

        const touch =
            event.changedTouches[0];

        const touchEndX =
            touch.clientX;

        const touchEndY =
            touch.clientY;

        const diffX =
            touchEndX - touchStartX;

        const diffY =
            touchEndY - touchStartY;

        /*
         * Ignore small movements
         */

        if (Math.abs(diffX) < 50) {
            return;
        }

        /*
         * Ignore mostly vertical swipes
         */

        if (Math.abs(diffY) > Math.abs(diffX)) {
            return;
        }

        /*
         * Swipe LEFT
         * → Next image
         */

        if (diffX < 0) {

            showPreview(
                currentPreviewIndex + 1
            );

        }

        /*
         * Swipe RIGHT
         * → Previous image
         */

        else {

            showPreview(
                currentPreviewIndex - 1
            );

        }

    },
    { passive: true }
);
    
});

loadAppDetail();

</script>
