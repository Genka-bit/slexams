<!DOCTYPE html>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>App Details | SLExam Pro</title>

<link rel="stylesheet"
      href="assets/css/style.css">

<style>

.app-detail-section {

    max-width: 900px;

    margin: auto;

    padding: 25px 15px;

}

.app-detail-card {

    background: white;

    border-radius: 18px;

    padding: 25px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,0.10);

    text-align: center;

}

.app-detail-image {

    width: 140px;

    height: 140px;

    object-fit: cover;

    border-radius: 25px;

    margin-bottom: 15px;

}

.app-detail-name {

    font-size: 28px;

    margin: 10px 0;

}

.app-detail-description {

    font-size: 17px;

    line-height: 1.8;

    color: #555;

    text-align: left;

    margin-top: 20px;

}

.app-info {

    margin-top: 20px;

    padding: 15px;

    background: #f5f7fa;

    border-radius: 12px;

    text-align: left;

}

.app-button {

    display: block;

    width: 100%;

    max-width: 450px;

    margin: 15px auto;

    padding: 14px 20px;

    border-radius: 12px;

    text-decoration: none;

    color: white;

    font-size: 17px;

    font-weight: bold;

    box-sizing: border-box;

}

.play-button {

    background: #16843d;

}

.download-button {

    background: #1976d2;

}

.website-button {

    background: #555;

}

.back-button {

    background: #777;

}


/* =========================
   PREVIEW GALLERY
   ========================= */

.app-preview-section {

    margin-top: 30px;

    text-align: left;

}

.app-preview-section h3 {

    margin-bottom: 15px;

}

.app-preview-gallery {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(160px, 1fr)
        );

    gap: 15px;

}

.app-preview-image {

    width: 100%;

    height: 220px;

    object-fit: cover;

    border-radius: 12px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.12);

    cursor: pointer;

    transition: 0.2s;

}

.app-preview-image:hover {

    transform: scale(1.02);

}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

    .app-detail-card {

        padding: 18px;

    }

    .app-detail-image {

        width: 120px;

        height: 120px;

    }

    .app-detail-name {

        font-size: 24px;

    }

    .app-preview-gallery {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 10px;

    }

    .app-preview-image {

        height: 180px;

    }

}

</style>

<script src="assets/js/app.js"></script>


<script>

async function loadAppDetail() {

    const container =
        document.getElementById("appDetail");


    /* =========================
       GET APP ID
       ========================= */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const appId =
        params.get("id");


    /* =========================
       CHECK ID
       ========================= */

    if (!appId) {

        container.innerHTML = `

            <h2>
                App Not Found
            </h2>

            <p>
                No application was selected.
            </p>

            <a
                class="app-button back-button"
                href="apps.html">

                ← Back to Apps

            </a>

        `;

        return;

    }


    try {

        /* =========================
           LOAD APPS JSON
           ========================= */

        const response =
            await fetch(
                "assets/data/apps.json?v=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Apps data could not be loaded."
            );

        }


        const data =
            await response.json();


        const apps =
            Array.isArray(data.apps)
            ? data.apps
            : [];


        /* =========================
           FIND APP
           ========================= */

        const app =
            apps.find(
                item =>
                    item.id === appId
            );


        if (!app) {

            container.innerHTML = `

                <h2>
                    App Not Found
                </h2>

                <p>
                    The requested application
                    could not be found.
                </p>

                <a
                    class="app-button back-button"
                    href="apps.html">

                    ← Back to Apps

                </a>

            `;

            return;

        }


        /* =========================
           BUTTONS
           ========================= */

        let buttons = "";


        /* =========================
           PLAY STORE
           ========================= */

        if (app.playStore) {

            buttons += `

                <a
                    class="app-button play-button"
                    href="${app.playStore}"
                    target="_blank"
                    rel="noopener noreferrer">

                    ▶ Google Play

                </a>

            `;

        }


        /* =========================
           DOWNLOAD
           ========================= */

        if (app.download) {

            buttons += `

                <a
                    class="app-button download-button"
                    href="${app.download}"
                    target="_blank"
                    rel="noopener noreferrer">

                    📥 Download App

                </a>

            `;

        }


        /* =========================
           WEBSITE
           ========================= */

        if (app.website) {

            buttons += `

                <a
                    class="app-button website-button"
                    href="${app.website}"
                    target="_blank"
                    rel="noopener noreferrer">

                    🌐 Official Website

                </a>

            `;

        }


        /* =========================
           PREVIEW IMAGES
           ========================= */

        let previewGallery = "";


        /*
         * Worker / apps.json-ல்
         * previewImages array இருந்தால்
         * அதை display செய்வோம்.
         */

        if (
            Array.isArray(
                app.previewImages
            ) &&
            app.previewImages.length > 0
        ) {

            previewGallery = `

                <div
                    class="app-preview-section">

                    <h3>
                        📸 App Preview
                    </h3>

                    <div
                        class="app-preview-gallery">

                        ${
                            app.previewImages
                                .map(
                                    image => `

                                    <img
    class="app-preview-image"
    src="${image}"
    alt="${app.name} Preview"
    loading="lazy"
    onclick="window.open('${image}', '_blank')">

                                `
                                )
                                .join("")
                        }

                    </div>

                </div>

            `;

        }


        /* =========================
           DISPLAY APP
           ========================= */

        container.innerHTML = `

            <img
    class="app-detail-image"
    src="${app.mainImage || ""}"
    alt="${app.name}"
    onerror="this.style.display='none'">


            <h1
                class="app-detail-name">

                ${app.name}

            </h1>


            <div
                class="app-info">

                <strong>
                    Platform:
                </strong>

                ${
                    app.platform === "android"
                    ? "🤖 Android"
                    : "🪟 Windows"
                }

                <br><br>


                <strong>
                    Version:
                </strong>

                ${
                    app.version ||
                    "Not specified"
                }

            </div>


            <div
                class="app-detail-description">

                <h3>
                    📝 About this App
                </h3>

                <p>

                    ${
                        app.description ||
                        app.demo ||
                        "No description available."
                    }

                </p>

            </div>


            ${previewGallery}


            ${buttons}


            <a
                class="app-button back-button"
                href="apps.html">

                ← Back to Apps

            </a>

        `;


        /* =========================
           PAGE TITLE
           ========================= */

        document.title =
            app.name +
            " | SLExam Pro";


    }

    catch (error) {

        console.error(
            "App detail error:",
            error
        );


        container.innerHTML = `

            <h2>
                Unable to Load App
            </h2>

            <p>
                Apps data could not be loaded.
            </p>

            <a
                class="app-button back-button"
                href="apps.html">

                ← Back to Apps

            </a>

        `;

    }

}


/* =========================
   START
   ========================= */

loadAppDetail();

</script>
