.app-preview-gallery {

<script>

async function loadAppDetail() {

    const container =
        document.getElementById("appDetail");


    /* =========================
       GET APP ID
       ========================= */

    const appParams =
    new URLSearchParams(
        window.location.search
    );

const appId =
    appParams.get("id");


    /* =========================
       CHECK ID
       ========================= */

    if (!appId) {

        container.innerHTML = `

            <h2>
                App Not Found
            </h2>

            <p>
                No application was selected.
            </p>

            <a
                class="app-button back-button"
                href="apps.html">

                ← Back to Apps

            </a>

        `;

        return;

    }


    try {

        /* =========================
           LOAD APPS JSON
           ========================= */

        const response =
            await fetch(
                "assets/data/apps.json?v=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Apps data could not be loaded."
            );

        }


        const data =
            await response.json();


        const apps =
            Array.isArray(data.apps)
            ? data.apps
            : [];


        /* =========================
           FIND APP
           ========================= */

        const app =
            apps.find(
                item =>
                    item.id === appId
            );

window.currentAppPreviewImages =
    Array.isArray(app.previewImages)
    ? app.previewImages
    : [];


        if (!app) {

            container.innerHTML = `

                <h2>
                    App Not Found
                </h2>

                <p>
                    The requested application
                    could not be found.
                </p>

                <a
                    class="app-button back-button"
                    href="apps.html">

                    ← Back to Apps

                </a>

            `;

            return;

        }


        /* =========================
           BUTTONS
           ========================= */

        let buttons = "";


        /* =========================
           PLAY STORE
           ========================= */

        if (app.playStore) {

            buttons += `

                <a
                    class="app-button play-button"
                    href="${app.playStore}"
                    target="_blank"
                    rel="noopener noreferrer">

                    ▶ Google Play

                </a>

            `;

        }


        /* =========================
           DOWNLOAD
           ========================= */

        if (app.download) {

            buttons += `

                <a
                    class="app-button download-button"
                    href="${app.download}"
                    target="_blank"
                    rel="noopener noreferrer">

                    📥 Download App

                </a>

            `;

        }


        /* =========================
           WEBSITE
           ========================= */

        if (app.website) {

            buttons += `

                <a
                    class="app-button website-button"
                    href="${app.website}"
                    target="_blank"
                    rel="noopener noreferrer">

                    🌐 Official Website

                </a>

            `;

        }


        /* =========================
           PREVIEW IMAGES
           ========================= */

        let previewGallery = "";


        /*
         * Worker / apps.json-ல்
         * previewImages array இருந்தால்
         * அதை display செய்வோம்.
         */

        if (
            Array.isArray(
                app.previewImages
            ) &&
            app.previewImages.length > 0
        ) {

            previewGallery = `

                <div
                    class="app-preview-section">

                    <h3>
                        📸 App Preview
                    </h3>

                    <div
                        class="app-preview-gallery">

                        ${
                            app.previewImages
                                .map(
                                    image => `

                                    <img
    class="app-preview-image"
    src="${image}"
    alt="${app.name} Preview"
    loading="lazy"
    onclick="window.open('${image}', '_blank')">

                                `
                                )
                                .join("")
                        }

                    </div>

                </div>

            `;

        }


        /* =========================
           DISPLAY APP
           ========================= */

        container.innerHTML = `

            <img
    class="app-detail-image"
    src="${app.mainImage || ""}"
    alt="${app.name}"
    onerror="this.style.display='none'">


            <h1
                class="app-detail-name">

                ${app.name}

            </h1>


            <div
                class="app-info">

                <strong>
                    Platform:
                </strong>

                ${
                    app.platform === "android"
                    ? "🤖 Android"
                    : "🪟 Windows"
                }

                <br><br>


                <strong>
                    Version:
                </strong>

                ${
                    app.version ||
                    "Not specified"
                }

            </div>


            <div
                class="app-detail-description">

                <h3>
                    📝 About this App
                </h3>

                <p>

                    ${
                        app.description ||
                        app.demo ||
                        "No description available."
                    }

                </p>

            </div>


            ${previewGallery}


            ${buttons}


            <a
                class="app-button back-button"
                href="apps.html">

                ← Back to Apps

            </a>

        `;


        /* =========================
           PAGE TITLE
           ========================= */

        document.title =
            app.name +
            " | SLExam Pro";


    }

    catch (error) {

        console.error(
            "App detail error:",
            error
        );


        container.innerHTML = `

            <h2>
                Unable to Load App
            </h2>

            <p>
                Apps data could not be loaded.
            </p>

            <a
                class="app-button back-button"
                href="apps.html">

                ← Back to Apps

            </a>

        `;

    }

}


/* =========================
   START
   ========================= */

loadAppDetail();

/* =========================
   FULL SCREEN IMAGE VIEWER
   ========================= */

.image-viewer {

    display: none;

    position: fixed;

    z-index: 9999;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    background: rgba(0, 0, 0, 0.92);

    align-items: center;
    justify-content: center;

}


/* Main Viewer Image */

.image-viewer-image {

    max-width: 90%;
    max-height: 85%;

    object-fit: contain;

    border-radius: 8px;

}


/* Close Button */

.image-viewer-close {

    position: absolute;

    top: 20px;
    right: 25px;

    color: white;

    font-size: 38px;

    cursor: pointer;

    z-index: 10001;

}


/* Previous / Next */

.image-viewer-prev,
.image-viewer-next {

    position: absolute;

    top: 50%;

    transform: translateY(-50%);

    color: white;

    background: rgba(255,255,255,0.15);

    border: none;

    width: 50px;
    height: 50px;

    border-radius: 50%;

    font-size: 28px;

    cursor: pointer;

}


.image-viewer-prev {

    left: 20px;

}


.image-viewer-next {

    right: 20px;

}


.image-viewer-prev:hover,
.image-viewer-next:hover {

    background: rgba(255,255,255,0.30);

}


/* Mobile */

@media (max-width:600px) {

    .image-viewer-image {

        max-width: 94%;
        max-height: 80%;

    }

    .image-viewer-prev,
    .image-viewer-next {

        width: 42px;
        height: 42px;

        font-size: 22px;

    }

    .image-viewer-prev {

        left: 8px;

    }

    .image-viewer-next {

        right: 8px;

    }

}

/* =========================
   FULL SCREEN IMAGE VIEWER
   ========================= */

let viewerImages = [];
let viewerIndex = 0;

const imageViewer =
    document.getElementById("imageViewer");

const imageViewerImage =
    document.getElementById("imageViewerImage");

const imageViewerClose =
    document.getElementById("imageViewerClose");

const imageViewerPrev =
    document.getElementById("imageViewerPrev");

const imageViewerNext =
    document.getElementById("imageViewerNext");


/* =========================
   OPEN VIEWER
   ========================= */

function openImageViewer(image) {

    /*
     * Get preview images from the
     * currently loaded app
     */

    viewerImages =
        Array.isArray(window.currentAppPreviewImages)
        ? window.currentAppPreviewImages
        : [image];


    viewerIndex =
        viewerImages.indexOf(image);


    if (viewerIndex < 0) {

        viewerIndex = 0;

    }


    imageViewerImage.src =
        viewerImages[viewerIndex];


    imageViewer.style.display =
        "flex";


    document.body.style.overflow =
        "hidden";

}


/* =========================
   CLOSE VIEWER
   ========================= */

function closeImageViewer() {

    imageViewer.style.display =
        "none";

    document.body.style.overflow =
        "";

}


/* =========================
   SHOW IMAGE
   ========================= */

function showViewerImage(index) {

    if (!viewerImages.length) {

        return;

    }


    if (index < 0) {

        index =
            viewerImages.length - 1;

    }


    if (
        index >=
        viewerImages.length
    ) {

        index = 0;

    }


    viewerIndex = index;


    imageViewerImage.src =
        viewerImages[viewerIndex];

}


/* =========================
   PREVIOUS
   ========================= */

imageViewerPrev.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        showViewerImage(
            viewerIndex - 1
        );

    }
);


/* =========================
   NEXT
   ========================= */

imageViewerNext.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        showViewerImage(
            viewerIndex + 1
        );

    }
);


/* =========================
   CLOSE BUTTON
   ========================= */

imageViewerClose.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        closeImageViewer();

    }
);


/* =========================
   CLICK BACKGROUND TO CLOSE
   ========================= */

imageViewer.addEventListener(
    "click",
    function(event) {

        if (
            event.target ===
            imageViewer
        ) {

            closeImageViewer();

        }

    }
);


/* =========================
   KEYBOARD CONTROLS
   ========================= */

window.addEventListener(
    "keydown",
    function(event) {

        if (
            imageViewer.style.display !==
            "flex"
        ) {

            return;

        }


        if (
            event.key ===
            "Escape"
        ) {

            closeImageViewer();

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            showViewerImage(
                viewerIndex - 1
            );

        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            showViewerImage(
                viewerIndex + 1
            );

        }

    }
);

</script>
