<script>

const params =
    new URLSearchParams(
        window.location.search
    );

const level =
    params.get("level");


const subjectLists = {

    primary: [
        "தமிழ்",
        "கணிதம்",
        "சுற்றாடல்",
        "ஆங்கிலம்",
        "இரண்டாம் மொழி"
    ],

    secondary: [
        "தமிழ்",
        "கணிதம்",
        "விஞ்ஞானம்",
        "வரலாறு",
        "புவியியல்",
        "குடியியல்",
        "ஆங்கிலம்",
        "சுகாதாரம்",
        "சைவசமயம்",
        "கத்தோலிக்கம்",
        "கிறிஸ்தவம்",
        "இஸ்லாம்",
        "அழகியல்",
        "சிங்களம்",
        "ICT",
        "PTS"
    ],

    al: [
        "Combined Mathematics",
        "Physics",
        "Chemistry",
        "Biology",
        "Agricultural Science",
        "ICT",
        "Accounting",
        "Business Studies",
        "Economics",
        "தமிழ்",
        "வரலாறு",
        "புவியியல்",
        "அரசியல் விஞ்ஞானம்",
        "இந்து சமயம்",
        "கிறிஸ்தவம்",
        "கத்தோலிக்கம்",
        "இந்து நாகரிகம்",
        "கிறிஸ்தவ நாகரிகம்",
        "தர்க்கவியல்",
        "சித்திரம்",
        "நடனம்",
        "இசை",
        "நாடகம்",
        "Science for Technology",
        "Engineering Technology",
        "Bio Systems Technology"
    ]

};


const subjectGrid =
    document.getElementById(
        "subjectGrid"
    );


const pageTitle =
    document.getElementById(
        "pageTitle"
    );


const pageDescription =
    document.getElementById(
        "pageDescription"
    );


if (
    level === "primary"
) {

    pageTitle.textContent =
        "📘 Grade 1 – 5 Schemes";

    pageDescription.textContent =
        "Select a subject";

}

else if (
    level === "secondary"
) {

    pageTitle.textContent =
        "📗 Grade 6 – 11 Schemes";

    pageDescription.textContent =
        "Select a subject";

}

else if (
    level === "al"
) {

    pageTitle.textContent =
        "📙 A/L Schemes";

    pageDescription.textContent =
        "Select a subject";

}


if (
    subjectLists[level]
) {

    subjectLists[level].forEach(
        function(subject) {

            const card =
                document.createElement(
                    "a"
                );

            card.className =
                "grade-card";

            card.href =
                "scheme-grades.html?level=" +
                encodeURIComponent(level) +
                "&subject=" +
                encodeURIComponent(subject);

            card.innerHTML =
                "<h2>" +
                subject +
                "</h2>" +
                "<p>View Schemes</p>";

            subjectGrid.appendChild(
                card
            );

        }
    );

}

</script>
