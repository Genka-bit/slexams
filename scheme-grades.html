<script>

(function () {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const level =
        params.get("level");


    const subject =
        params.get("subject");


    const subjectTitle =
        document.getElementById(
            "subjectTitle"
        );


    const gradeGrid =
        document.getElementById(
            "gradeGrid"
        );


    /*
     * Subject title
     */

    if (subject) {

        subjectTitle.textContent =
            "📚 " + subject + " – Schemes";

    }


    /*
     * Determine grades
     */

    let grades = [];


    if (level === "primary") {

        grades = [
            1,
            2,
            3,
            4,
            5
        ];

    }


    else if (level === "secondary") {

        grades = [
            6,
            7,
            8,
            9,
            10,
            11
        ];

    }


    else if (level === "al") {

        /*
         * A/L will be handled
         * separately.
         */

        grades = [
            "A/L"
        ];

    }


    /*
     * Create Grade cards
     */

    grades.forEach(
        function (grade) {

            const card =
                document.createElement(
                    "a"
                );


            card.className =
                "grade-card";


            card.href =
                "scheme-view.html?level=" +
                encodeURIComponent(level) +
                "&subject=" +
                encodeURIComponent(subject) +
                "&grade=" +
                encodeURIComponent(grade);


            card.innerHTML =
                "<h2>Grade " +
                grade +
                "</h2>";


            gradeGrid.appendChild(
                card
            );

        }
    );


})();

</script>
